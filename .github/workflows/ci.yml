name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }} (${{ matrix.dependencies }} deps)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        dependencies: [highest]
        include:
          # oldest supported PHP with the oldest allowed versions (e.g. Symfony 6.4)
          - php: '8.2'
            dependencies: lowest
    steps:
      - uses: actions/checkout@v4

      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends imagemagick

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: gd, exif
          coverage: none

      - name: Install dependencies (highest)
        if: matrix.dependencies == 'highest'
        run: composer update --no-interaction --no-progress

      - name: Install dependencies (lowest)
        if: matrix.dependencies == 'lowest'
        run: composer update --no-interaction --no-progress --prefer-lowest --prefer-stable

      - run: vendor/bin/phpunit

  code-quality:
    name: Code quality (Composer, Rector, php-cs-fixer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gd, exif
          coverage: none
      - name: Validate composer.json
        run: composer validate --strict --no-check-lock

      - run: composer update --no-interaction --no-progress

      - name: Security audit of dependencies
        run: composer audit

      - name: Rector
        run: vendor/bin/rector process --dry-run --no-progress-bar

      - name: php-cs-fixer
        run: vendor/bin/php-cs-fixer fix --dry-run --diff
